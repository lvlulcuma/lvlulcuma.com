# Publishes the weekly news digest at 01:11 on Monday (Eastern Time) without waiting for a manual review
# (the site owner's choice), with a breakdown for each of its stories, and incident breakdowns the owner asked to
# publish automatically.
#
# Claude's scheduled task writes each digest and its breakdowns just after midnight on a branch named
# claude/digest-YYYY-wNN and opens one pull request. Another incident breakdown is published this way only when the
# owner asked for it; it goes on a branch named claude/autopublish-incident-<folder>. What each kind may change:
# scripts/autopublish/scope.sh.
# Two jobs here:
#   - check:   runs on those pull requests right away, so problems show early. Read-only: it can't merge anything.
#   - publish: runs on a schedule from main (so a pull request can't change these rules), and merges such a pull
#              request into main (which deploys the site) only if ALL of these hold:
#                - the branch is in this repository and the pull request isn't a draft;
#                - every changed file is inside the folders its kind may change (scope.sh);
#                - it's due (scripts/autopublish/due.py): a digest from 01:11 on the Monday after its week,
#                  a breakdown from 01:11 on the day of the run (Eastern Time);
#                - the site builds (main's code plus those folders), passes the CSP check and has no broken
#                  links, both as published and with every language on.
#              It merges exactly the commit it checked, breakdowns before digests (a digest story can link to a
#              breakdown). If any check fails, the pull request stays open.
# The publish job runs hourly through Monday, so a pull request that's finished after 01:11 goes out at the next run.
# Run "Publish weekly digest" by hand from the Actions tab to publish whatever is finished straight away.
# To hold one back, mark its pull request as a draft. To stop auto-publishing, delete this file.

name: Publish weekly digest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  schedule:
    # GitHub's schedule is in UTC: hourly from 05:11 UTC, the first run at or after 01:11 Eastern Time in summer
    # and in winter, until Monday evening. GitHub sometimes starts scheduled runs a few minutes late.
    - cron: "11 5-23 * * 1"
  workflow_dispatch:

concurrency:
  group: digest-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'claude/digest-') || startsWith(github.head_ref, 'claude/autopublish-incident-')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Only the folders this kind of pull request may change
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/autopublish/scope.sh "$HEAD_REF" "origin/$BASE_REF" "$HEAD_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with every language on, and check links
        run: npm run build:all-langs
      - name: Build as published, and check links
        run: npm run build && npm run check:links

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Find pull requests that are due
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && '--now-ok' || '' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq "
            .[] | select(.draft == false)
                | select(.head.repo.full_name == \"${GITHUB_REPOSITORY}\")
                | select(.head.ref | test(\"^claude/(digest-[0-9]{4}-w[0-9]{2}|autopublish-incident-[a-z0-9-]+)\$\"))
                | \"\(.number) \(.head.ref) \(.head.sha)\"" > candidates.txt
          : > due.txt
          while read -r num ref sha; do
            [ -n "$num" ] || continue
            if python3 scripts/autopublish/due.py "$ref" ${BY_HAND:+"$BY_HAND"}; then
              echo "#$num ($ref): due"; echo "$num $ref $sha" >> due.txt
            else
              echo "#$num ($ref): not due yet"
            fi
          done < candidates.txt
          # Breakdowns first: a digest story may link to one.
          { grep ' claude/autopublish-incident-' due.txt || true; grep ' claude/digest-' due.txt || true; } > order.txt
          [ -s order.txt ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "Nothing is waiting to be published."

      - uses: actions/setup-node@v5
        if: steps.find.outputs.any == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Check and publish
        if: steps.find.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          cp scripts/autopublish/scope.sh "$RUNNER_TEMP/scope.sh"   # main's rules, whatever a pull request contains
          status=0
          while read -r num ref sha; do
            echo "::group::#$num ($ref)"
            # Start each pull request from a clean copy of the latest main, so it's built together with anything
            # published a moment ago (node_modules and dist are ignored, so they stay).
            git fetch -q origin main
            git checkout -q -f --detach origin/main && git reset -q --hard origin/main && git clean -fdq
            git fetch -q origin "$sha"
            if ! folders=$(bash "$RUNNER_TEMP/scope.sh" "$ref" origin/main "$sha"); then
              echo "Left open for a person."; status=1; echo "::endgroup::"; continue
            fi
            # Build main's code with only those folders taken from the pull request.
            take() { for f in $folders; do rm -rf "$f"; git checkout -q "$sha" -- "$f" || return 1; done; }
            if ! take || ! { npm run build:all-langs && npm run build && npm run check:links; }; then
              echo "Checks failed: left open for a person."; status=1
            elif gh pr merge "$num" --squash --delete-branch --match-head-commit "$sha"; then
              echo "Published #$num ($ref)."
            else
              echo "GitHub refused the merge: left open for a person."; status=1
            fi
            echo "::endgroup::"
          done < order.txt
          exit $status
