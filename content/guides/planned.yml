# Guides that a page already points to but that aren't written yet.
#
# Overview pages (the lab's Get started, for now) stay short and high level. Where they talk about a task a reader may
# want every click for, they point to its guide right there: <!-- guide: install-utm --> at the end of the paragraph
# or list item (or a `guide:` field in a picture's card) adds a "Step by step" line under it. A published guide is a
# link there; a guide listed here shows its working title and "Coming soon", without a link, until it's published.
#
# Write them one at a time, each in its own run and pull request (docs/claude/guide.md), top to bottom unless the
# owner picks another. Delete the guide's entry here in that same pull request: the build stops if a published guide
# is still listed. A draft guide (draft: true) can stay listed until it's published.
#
#   slug        the folder the guide will get in content/guides/ (its address: /en/guides/<slug>/)
#   title       working title, shown until the guide exists; the guide's own title replaces it
#   category    install | quick | configure | use | harden | fix
#   platforms   windows | macos | linux
#   scope       what it should cover, for whoever writes it (never shown on the site). A starting point, not a
#               source: check every fact in the guide's own run.
guides:
  # Windows targets.
  - slug: set-up-windows-trial-virtualbox
    title: "Set up a Windows 11 trial in VirtualBox"
    category: install
    platforms: [windows, linux]
    scope: "Evaluation Center ISO (90 days, no key), the VirtualBox settings Windows 11 needs (TPM, Secure Boot, memory), install, activate online on NAT, snapshot, what to do when the trial ends."
