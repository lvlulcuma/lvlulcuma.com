# The plan for the CWE section: which write-up explains which CWEs, in the order they'll be written.
# Every one of the 249 CWEs in owasp-2025.yml is on exactly one page (the build checks this). A page is named
# after its main CWE (its folder: content/cwe/<cwe>/) and also explains the CWEs in `covers:`, which are
# variants or close relatives of the same mistake. Once a page is written, all of its CWEs link to it on /cwe/.
#   kind: full   a complete write-up (attack and defense sides)
#   kind: short  a shorter one: rarely a web problem, or a narrow topic
# `title` is a working title; the write-up's own `title:` is what readers see.
# Next one to write:  python3 scripts/cwe/next.py
