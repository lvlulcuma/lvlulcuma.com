  - name: "ENISA ECSF, Cyber Incident Responder profile"
    url: "https://www.enisa.europa.eu/publications/european-cybersecurity-skills-framework-role-profiles"
  - name: "AWS Certified Security – Specialty (SCS-C03)"
    url: "https://aws.amazon.com/certification/certified-security-specialty/"
  - name: "MITRE ATT&CK, Cloud matrix"
    url: "https://attack.mitre.org/matrices/enterprise/cloud/"
  - name: "CSA Cloud Controls Matrix v4.1"
    url: "https://cloudsecurityalliance.org/artifacts/cloud-controls-matrix-v4-1"
