    url: "https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist/"
  - name: "OWASP Top 10 CI/CD Security Risks"
    url: "https://owasp.org/www-project-top-10-ci-cd-security-risks/"
  - name: "NIST SP 800-204D, Software Supply Chain Security in DevSecOps CI/CD Pipelines (2024)"
    url: "https://csrc.nist.gov/pubs/sp/800/204/d/final"
  - name: "SLSA, Supply-chain Levels for Software Artifacts"
